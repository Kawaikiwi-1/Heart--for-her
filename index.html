<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Yuri ❤️</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

canvas{
    position:absolute;
}

h1{
    position:absolute;
    color:hotpink;
    font-family:Arial,sans-serif;
    font-size:32px;
    text-align:center;
}
</style>

</head>
<body>

<h1>I love you, Yuri ❤️</h1>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

ctx.strokeStyle = "hotpink";
ctx.lineWidth = 2;

ctx.beginPath();

for(let i=0;i<=600;i++){

    let t=i/20;

    let x=16*Math.pow(Math.sin(t),3);
    let y=13*Math.cos(t)
          -5*Math.cos(2*t)
          -2*Math.cos(3*t)
          -Math.cos(4*t);

    x=x*18+canvas.width/2;
    y=-y*18+canvas.height/2;

    if(i===0){
        ctx.moveTo(x,y);
    }else{
        ctx.lineTo(x,y);
    }
}

ctx.stroke();
</script>

</body>
</html>
